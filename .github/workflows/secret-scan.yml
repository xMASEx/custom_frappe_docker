name: Secret Scan

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - ci/**
      - feat/**
      - fix/**
      - chore/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect-secrets:
    name: Secret scan (detect-secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install detect-secrets
        run: python -m pip install --upgrade 'detect-secrets==1.5.0'

      - name: Run non-printing secret scan
        run: python .github/scripts/secret_scan_gate.py
